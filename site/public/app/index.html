<body class="live-page">
<main class="live-main">
  <section id="live-demo" class="live-demo" aria-label="Interactive Topophany terminal" aria-busy="true"
    data-mode="live" data-language="en" data-wasm="/data/viewer.wasm?v=ef6b79eb1a88" data-worker="/js/collector-worker.1dfc868a750f.js">
    <div class="live-bar">
      <a class="live-home" href="/" aria-label="Topophany home"><img src="/favicon.svg" alt="" width="18" height="18">topophany</a>
      <span class="live-title" aria-hidden="true">topo</span>
      <span class="live-size" aria-hidden="true"></span>
    </div>
    <div class="demo-viewport">
      <canvas id="demo-canvas" tabindex="0" role="application" aria-label="Interactive Topophany terminal"></canvas>
      <input class="demo-input" type="text" aria-label="Type a terminal search" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1">
      <div class="demo-loading" role="status"><noscript>This terminal needs JavaScript.</noscript></div>
      <form id="collector-connect" class="collector-connect" autocomplete="off" hidden>
        <p class="connect-brand" aria-hidden="true"><b>◉ TOPOPHANY</b></p>
        <div class="connect-box">
          <h1>Connect to a collector</h1>
          <p class="connect-note">Read-only. Your token goes straight to the collector and is never saved.</p>
          <label class="connect-field" for="collector-server"><span>Collector URL</span><input id="collector-server" name="server" type="url" placeholder="https://monitor.example.com" required></label>
          <label class="connect-field" for="collector-project"><span>Project ID</span><input id="collector-project" name="project" type="text" required autocapitalize="off" spellcheck="false"></label>
          <label class="connect-field" for="collector-token"><span>Viewer token</span><input id="collector-token" name="token" type="password" autocomplete="off" minlength="32" maxlength="512" required></label>
          <div class="connect-actions">
            <p id="collector-error" role="status"></p>
            <button type="submit">Connect</button>
          </div>
        </div>
        <p class="connect-keys" aria-hidden="true"><kbd>Tab</kbd> Move <kbd>Enter</kbd> Connect</p>
      </form>
    </div>
    <pre id="demo-transcript" class="sr-only" aria-label="Interactive Topophany terminal"></pre>
  </section>
</main>
