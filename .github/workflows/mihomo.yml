name: Mihomo compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/adapters/mihomo/**'
      - 'internal/probe/**'
      - 'scripts/*mihomo*'
      - '.github/workflows/mihomo.yml'
permissions:
  contents: read
jobs:
  real-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v1.19.32, v1.19.33]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and fetch verified core
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/topo.exe" ./cmd/topo
          python scripts/fetch_mihomo.py --version '${{ matrix.version }}' --output "$RUNNER_TEMP/mihomo.exe"
      - name: Capacity and real network checks
        shell: bash
        run: |
          python scripts/accept_mihomo.py --core "$RUNNER_TEMP/mihomo.exe" --topo "$RUNNER_TEMP/topo.exe" --output receipts/capacity.json
          python scripts/accept_mihomo_network.py --core "$RUNNER_TEMP/mihomo.exe" --topo "$RUNNER_TEMP/topo.exe" --output receipts/network.json
      - name: Isolated Linux TUN capture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net bash -c 'ip link set lo up; exec python3 "$1" --core "$2" --topo "$3" --tun --output "$4"' bash "$PWD/scripts/accept_mihomo_network.py" "$RUNNER_TEMP/mihomo.exe" "$RUNNER_TEMP/topo.exe" "$PWD/receipts/tun.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mihomo-${{ matrix.version }}-${{ matrix.os }}
          path: receipts/
