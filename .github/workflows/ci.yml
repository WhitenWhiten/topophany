name: CI

on:
  # Source, test fixtures and build/test configuration only. Keep Coverage's
  # pull_request filter in sync; site deployment has its own Cloudflare filter.
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'examples/**'
      - 'deploy/**'
      - 'docs/contracts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/README*'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'examples/**'
      - 'deploy/**'
      - 'docs/contracts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/README*'
  workflow_dispatch:
    inputs:
      site:
        description: Build and check the site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: vet without device simulation
        run: go vet -tags nodevice ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TOPO_REQUIRE_OLD_READER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require real old-reader compatibility pass
        if: runner.os == 'Linux'
        run: python3 scripts/check_compatibility.py
      - name: Test (race)
        if: runner.os != 'Windows'
        # Match verify.py: race-instrumented tour/render tests can exceed the
        # default ten-minute package timeout on shared macOS runners.
        run: go test -race -count=1 -timeout=15m ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build
        run: go build -trimpath -o ${{ runner.temp }}/topo ./cmd/topo
      - name: Kernel memory cap acceptance
        if: runner.os == 'Linux'
        run: |
          go test -c -o "${{ runner.temp }}/memlimit.test" ./internal/memlimit
          sudo env TOPO_TEST_CGROUP=/sys/fs/cgroup "${{ runner.temp }}/memlimit.test" -test.run '^TestKernelMemoryMax$' -test.v

  acceptance:
    runs-on: ubuntu-latest
    env:
      TOPO_REQUIRE_OLD_READER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect site changes
        id: site
        run: python3 scripts/site_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build browser binaries from source
        if: steps.site.outputs.changed == 'true'
        run: python3 scripts/build_demo.py
      - name: Generated site and tours are current
        if: steps.site.outputs.changed == 'true'
        run: make site-check
      - name: Browser transport and interaction regressions
        if: steps.site.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
          npm run test:browser
      - name: Full acceptance suite
        env:
          TOPO_CHECK_SITE: ${{ steps.site.outputs.changed }}
        run: python3 scripts/verify.py --output ${{ runner.temp }}/verification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification
          path: ${{ runner.temp }}/verification/

  native-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tagged Go regression and race checks
        run: go test -tags webui -race -count=1 -timeout=15m ./...
      - name: Cross-build optional binary
        run: |
          GOOS=linux GOARCH=amd64 go build -tags webui -o "$RUNNER_TEMP/topo-web-amd64" ./cmd/topo
          GOOS=linux GOARCH=arm64 go build -tags webui -o "$RUNNER_TEMP/topo-web-arm64" ./cmd/topo
      - name: Browser protocol tests
        run: node --test internal/webui/tests/*.test.mjs
      - name: Install optional browser test dependencies
        working-directory: internal/webui
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Native browser acceptance against a local collector
        env:
          TOPO_WEB_BINARY: ${{ runner.temp }}/topo-web-amd64
          TOPO_WEB_ARTIFACTS: ${{ runner.temp }}/native-webui-browser
        run: node internal/webui/tests/browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-webui-browser
          path: ${{ runner.temp }}/native-webui-browser/
